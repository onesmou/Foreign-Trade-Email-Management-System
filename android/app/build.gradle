plugins { id 'com.android.application' }

def signingFile = new File(System.getenv('CRM_ANDROID_SIGNING_PROPERTIES') ?: rootProject.file('key.properties').absolutePath)
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
android {
    namespace 'com.rehabintl.crm'
    compileSdk 36
    defaultConfig {
        applicationId 'com.rehabintl.crm'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'CRM_URL', '"https://wmcrm.jbenlz.com/"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile new File(signingFile.parentFile, signing['storeFile'])
                storeType 'PKCS12'
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            if (signingFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            debuggable false
        }
    }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
